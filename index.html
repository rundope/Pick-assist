<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pick-assist</title>
</head>
<body>
  <h1>Pick-assist</h1>

  <!--
    pick-core: DOM을 건드리지 않는 순수 로직.
    tests/가 이 블록을 그대로 읽어 Node.js에서 실행한다.
    id와 "var PickCore" 선언을 바꾸지 말 것.
  -->
  <script id="pick-core">
  var PickCore = (function () {
    "use strict";

    // ─────────────────────────────────────────────
    // 건강·안전 키워드
    // 비교할 때 입력과 키워드 모두 공백을 지우고 소문자로 바꾼다.
    // 그래서 "죽고 싶"은 "죽고싶"도 잡는다.
    // 짧은 단어는 오탐이 많으니 넣기 전에 일상 표현과 겹치는지 확인할 것.
    //   예: "주사"는 "주사위"와 겹쳐서 "주사 맞", "주사를"로 쓴다.
    //   예: "약" 단독은 "약속", "예약"과 겹쳐서 쓰지 않는다.
    // ─────────────────────────────────────────────

    // 자해·자살 표현 → 추첨하지 않고 자살예방 상담전화 109 안내
    var SELF_HARM_KEYWORDS = [
      "자살",
      "자해",
      "죽고 싶",
      "죽을까",
      "죽어버릴",
      "죽어 버릴",
      "죽고 말",
      "목숨을 끊",
      "극단적 선택",
      "극단적인 선택",
      "뛰어내릴",
      "투신",
      "목매",
      "번개탄",
      "유서를",
      "유서 쓰",
      "사라지고 싶",
      "살기 싫",
      "suicide",
      "kill myself",
      "self harm",
      "self-harm"
    ];

    // 건강·안전 표현 → 추첨하지 않고 "전문가와 상의하세요"
    var HEALTH_KEYWORDS = [
      "약 복용",
      "복용",
      "투약",
      "처방",
      "약 먹",
      "약을 먹",
      "약 끊",
      "약을 끊",
      "약 안 먹",
      "약 그만",
      "진통제",
      "수면제",
      "항생제",
      "해열제",
      "항우울제",
      "혈압약",
      "인슐린",
      "치료 중단",
      "치료를 중단",
      "치료 그만",
      "치료 받",
      "치료를 받",
      "항암",
      "수술",
      "시술",
      "입원",
      "퇴원",
      "응급실",
      "병원",
      "진료",
      "주사 맞",
      "주사를",
      "백신",
      "접종",
      "임신",
      "낙태",
      "투석",
      "음주운전",
      "술 먹고 운전",
      "술 마시고 운전",
      "medication",
      "surgery",
      "chemo"
    ];

    // ─────────────────────────────────────────────
    // 구분자
    // vs / or 는 영문·숫자 사이에 끼어 있으면 구분자로 보지 않는다.
    //   "orange vs color" → "orange", "color" (or가 단어 안에 있음)
    // 대소문자는 가리지 않는다 (vs, VS, Vs, OR 모두 인식).
    // ─────────────────────────────────────────────
    var LATIN_SEPARATOR = /(^|[^a-z0-9])(?:vs\.?|or)(?=[^a-z0-9]|$)/gi;
    var PLAIN_SEPARATORS = ["/", "아니면"];
    var SPLIT_MARK = "\u0000";

    // ─────────────────────────────────────────────
    // 문구
    // {c} = 고른 쪽, {o} = 고르지 않은 쪽.
    // {c:으로} 처럼 쓰면 받침에 맞춰 조사를 붙인다.
    // 지원 조사: 으로, 은, 이, 을, 과
    // ─────────────────────────────────────────────
    var RESULT_LINES = [
      "{c}. 고민 끝.",
      "{c:으로} 떠먹여 드립니다."
    ];

    var LIKE_LINES = [
      "좋습니다. 그대로 가세요."
    ];

    var OTHER_LINE = "그럼 이미 답은 정해져 있었네요. {o:으로} 가세요.";

    var NOTICES = {
      empty: "두 가지를 적어 주세요. 예: 짜장 vs 짬뽕",
      single: "선택지가 하나뿐이네요. vs로 하나 더 붙여 주세요.",
      same: "둘이 똑같네요. 고민할 필요가 없습니다.",
      tooMany: "둘 중 하나만 골라 드립니다. 두 개로 줄여 주세요."
    };

    var SAFETY_MESSAGES = {
      health: "이 결정은 전문가와 상의하세요.",
      selfHarm: "이건 제가 대신 고를 일이 아니에요. 혼자 견디지 말고 자살예방 상담전화 109에 전화해 이야기해 주세요. 24시간 열려 있습니다."
    };

    // ─────────────────────────────────────────────
    // 난수
    // ─────────────────────────────────────────────

    // 0 이상 max 미만의 정수를 균등하게 뽑는다.
    // 나머지 연산 편향을 없애려고 limit 이상 값은 버리고 다시 뽑는다.
    // max가 2면 limit이 2^32라서 버리는 값이 없다.
    function cryptoRandomInt(max) {
      var isValid = Math.floor(max) === max && max >= 1 && max <= 0x100000000;
      if (!isValid) {
        throw new RangeError("max must be an integer between 1 and 2^32");
      }
      if (typeof crypto === "undefined" || !crypto.getRandomValues) {
        throw new Error("crypto.getRandomValues is not available");
      }

      var buffer = new Uint32Array(1);
      var limit = Math.floor(0x100000000 / max) * max;

      do {
        crypto.getRandomValues(buffer);
      } while (buffer[0] >= limit);

      return buffer[0] % max;
    }

    // ─────────────────────────────────────────────
    // 파싱
    // ─────────────────────────────────────────────

    function normalizeForCompare(text) {
      return text.normalize("NFC").replace(/\s+/g, " ").trim().toLowerCase();
    }

    // 결과: { ok: true, choices: [a, b] }
    //    또는 { ok: false, reason: "empty" | "single" | "same" | "tooMany" }
    function parseChoices(input) {
      var text = String(input || "").normalize("NFC");

      text = text.replace(LATIN_SEPARATOR, function (match, before) {
        return before + SPLIT_MARK;
      });

      PLAIN_SEPARATORS.forEach(function (separator) {
        text = text.split(separator).join(SPLIT_MARK);
      });

      var parts = text
        .split(SPLIT_MARK)
        .map(function (part) {
          return part.replace(/\s+/g, " ").trim();
        })
        .filter(function (part) {
          return part.length > 0;
        });

      if (parts.length === 0) {
        return { ok: false, reason: "empty" };
      }
      if (parts.length === 1) {
        return { ok: false, reason: "single" };
      }
      if (parts.length > 2) {
        return { ok: false, reason: "tooMany" };
      }
      if (normalizeForCompare(parts[0]) === normalizeForCompare(parts[1])) {
        return { ok: false, reason: "same" };
      }

      return { ok: true, choices: parts };
    }

    // ─────────────────────────────────────────────
    // 건강·안전 필터
    // ─────────────────────────────────────────────

    function compact(text) {
      return String(text || "").normalize("NFC").replace(/\s+/g, "").toLowerCase();
    }

    function containsAny(text, keywords) {
      var target = compact(text);
      return keywords.some(function (keyword) {
        return target.indexOf(compact(keyword)) !== -1;
      });
    }

    // 결과: "selfHarm" | "health" | null
    // 자해·자살이 건강보다 우선한다.
    function checkSafety(input) {
      if (containsAny(input, SELF_HARM_KEYWORDS)) {
        return "selfHarm";
      }
      if (containsAny(input, HEALTH_KEYWORDS)) {
        return "health";
      }
      return null;
    }

    // ─────────────────────────────────────────────
    // 결정
    // 필터 → 파싱 → 추첨 순서. 필터에 걸리면 randomInt를 부르지 않는다.
    // ─────────────────────────────────────────────

    function decide(input, randomInt) {
      var draw = randomInt || cryptoRandomInt;

      var safety = checkSafety(input);
      if (safety) {
        return { status: "safety", kind: safety, message: SAFETY_MESSAGES[safety] };
      }

      var parsed = parseChoices(input);
      if (!parsed.ok) {
        return { status: "invalid", reason: parsed.reason, message: NOTICES[parsed.reason] };
      }

      var index = draw(2);
      return {
        status: "picked",
        choices: parsed.choices,
        index: index,
        picked: parsed.choices[index],
        other: parsed.choices[1 - index]
      };
    }

    // ─────────────────────────────────────────────
    // 조사
    // ─────────────────────────────────────────────

    var HANGUL_START = 0xac00;
    var HANGUL_END = 0xd7a3;
    var JONG_RIEUL = 8;

    // 숫자를 한국어로 읽었을 때 받침: 영 일 이 삼 사 오 육 칠 팔 구
    var DIGIT_JONG = [21, 8, 0, 16, 0, 0, 1, 8, 8, 0];

    // 마지막 글자의 받침 번호. 0이면 받침 없음.
    // 영문 등 판단하기 어려운 글자는 받침 없음으로 본다.
    function finalConsonant(word) {
      var trimmed = String(word).replace(/[^0-9A-Za-z가-힣]+$/, "");
      if (trimmed.length === 0) {
        return 0;
      }

      var last = trimmed.charAt(trimmed.length - 1);
      var code = last.charCodeAt(0);

      if (code >= HANGUL_START && code <= HANGUL_END) {
        return (code - HANGUL_START) % 28;
      }
      if (last >= "0" && last <= "9") {
        return DIGIT_JONG[Number(last)];
      }
      return 0;
    }

    function withParticle(word, particle) {
      var jong = finalConsonant(word);
      var hasJong = jong !== 0;

      switch (particle) {
        case "으로":
          return word + (hasJong && jong !== JONG_RIEUL ? "으로" : "로");
        case "은":
          return word + (hasJong ? "은" : "는");
        case "이":
          return word + (hasJong ? "이" : "가");
        case "을":
          return word + (hasJong ? "을" : "를");
        case "과":
          return word + (hasJong ? "과" : "와");
        default:
          return word + particle;
      }
    }

    function fillTemplate(template, values) {
      return template.replace(/\{([co])(?::([^}]+))?\}/g, function (match, key, particle) {
        var word = key === "c" ? values.picked : values.other;
        return particle ? withParticle(word, particle) : word;
      });
    }

    // 문구 순번을 고른다. 직전 문구(avoidIndex)는 다시 나오지 않게 한다.
    // 이것은 문구 선택일 뿐 결과(어느 쪽을 고르는지)와는 무관하다.
    function pickLineIndex(count, randomInt, avoidIndex) {
      var draw = randomInt || cryptoRandomInt;
      var canAvoid = count > 1 && avoidIndex >= 0 && avoidIndex < count;

      if (!canAvoid) {
        return draw(count);
      }

      var index = draw(count - 1);
      return index >= avoidIndex ? index + 1 : index;
    }

    return {
      SELF_HARM_KEYWORDS: SELF_HARM_KEYWORDS,
      HEALTH_KEYWORDS: HEALTH_KEYWORDS,
      RESULT_LINES: RESULT_LINES,
      LIKE_LINES: LIKE_LINES,
      OTHER_LINE: OTHER_LINE,
      NOTICES: NOTICES,
      SAFETY_MESSAGES: SAFETY_MESSAGES,
      cryptoRandomInt: cryptoRandomInt,
      parseChoices: parseChoices,
      checkSafety: checkSafety,
      decide: decide,
      withParticle: withParticle,
      fillTemplate: fillTemplate,
      pickLineIndex: pickLineIndex
    };
  })();
  </script>
</body>
</html>
