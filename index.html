6 12.9 154.4 5.2 198 22.1C214.5 28.5 234.5 42.6 244.7 55C255.9 68.6 264.9 85.5 262.2 88.2C259.9 90.5 256 87.8 246.9 77.4C234.2 63 225.3 54.9 213.9 47.4C195.6 35.3 179.6 30.2 158 29.3C109.5 27.3 64.3 54.4 42.5 98.5C21.2 141.5 28 187.8 60.3 219.2C67.1 225.9 67.8 229.3 62.4 229.8C60.1 230 57.9 229.1 53.4 225.7ZM221.1 123.3C216.6 119.6 219.3 112 225 112C228.5 112 231 114.8 231 118.7C231 123.9 225.1 126.6 221.1 123.3Z'/%3E%3C/svg%3E">
  <title>Pick-assist — 망설이지 마세요</title>

  <style>
    /* 콘셉트: 판결을 내리는 법정. 남색 잉크(로고 색), 양피지, 황동, 판결 도장. */
    :root {
      --bg: #f3eee3;
      --surface: #fffdf8;
      --text: #1b2a47;
      --muted: #69708a;
      --line: #d8cdb7;
      --gold: #a07a2c;
      --gold-soft: #efe3c6;
      --button: #1b2a47;
      --button-text: #fdf8ec;
      --verdict: #8c1d2c;
      --warn-bg: #fff5d8;
      --warn-line: #e5cc85;
      --care-bg: #e7eef8;
      --care-line: #b3c6e0;
      --shadow: 0 14px 34px rgba(27, 42, 71, 0.12);
      --radius: 14px;
      --logo: #1b2a47;
      --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR",
        "Malgun Gothic", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1422;
        --surface: #161e31;
        --text: #ece5d3;
        --muted: #9aa3ba;
        --line: #2b3652;
        --gold: #d8b261;
        --gold-soft: #2c2a25;
        --button: #d8b261;
        --button-text: #10172a;
        --verdict: #f0c96a;
        --warn-bg: #2d2817;
        --warn-line: #5d5026;
        --care-bg: #15243a;
        --care-line: #2f4a6b;
        --shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
        --logo: #e6dcc3;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.5;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ── 머리: 법정 문장(紋章)처럼 가운데 정렬 ── */

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .brand .logo {
      width: 64px;
      height: auto;
      color: var(--logo);
    }

    .wordmark {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .house {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--gold);
    }

    .rule {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 20px 0 18px;
      color: var(--gold);
    }

    .rule::before,
    .rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .rule svg {
      width: 22px;
      height: 22px;
      flex: none;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.7rem, 7.4vw, 2.2rem);
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.01em;
      text-align: center;
    }

    .slogan-main,
    .slogan-sub {
      display: block;
    }

    .slogan-sub {
      margin-top: 6px;
      font-size: 0.62em;
      font-weight: 700;
      letter-spacing: 0;
    }

    .lede {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    /* ── 사건 접수: 두 선택지 ── */

    .form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .fields {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .versus {
      position: relative;
      z-index: 1;
      align-self: center;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin: -8px 0;
      border: 1px solid var(--gold);
      border-radius: 50%;
      background: var(--bg);
      color: var(--gold);
      font-family: var(--serif);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .input {
      width: 100%;
      min-height: 58px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 1.12rem;
      text-align: center;
      -webkit-appearance: none;
      appearance: none;
    }

    .input::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    .input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-soft);
    }

    button {
      font: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      padding: 0 22px;
      border: 0;
      border-radius: var(--radius);
      background: var(--button);
      color: var(--button-text);
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    .primary svg {
      width: 22px;
      height: 22px;
      flex: none;
    }

    .primary:active {
      transform: scale(0.98);
    }

    .primary:disabled {
      opacity: 0.65;
    }

    .notice {
      margin: 14px 2px 0;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .safety {
      margin-top: 20px;
      padding: 16px 18px;
      border: 1px solid var(--warn-line);
      border-radius: var(--radius);
      background: var(--warn-bg);
      font-weight: 600;
    }

    .safety.is-care {
      border-color: var(--care-line);
      background: var(--care-bg);
    }

    .safety p {
      margin: 0;
    }

    .call-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 12px;
      padding: 0 18px;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      font-weight: 800;
      text-decoration: none;
    }

    /* ── 판결문 ── */

    .result {
      position: relative;
      margin-top: 24px;
      padding: 22px 20px 20px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }

    /* 문서 테두리처럼 안쪽에 한 줄 더 */
    .result::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid var(--gold-soft);
      border-radius: 3px;
      pointer-events: none;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0;
      color: var(--gold);
      font-family: var(--serif);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
    }

    .gavel {
      width: 30px;
      height: 30px;
      flex: none;
      transform-origin: 80% 80%;
    }

    .picked {
      margin: 14px 0 8px;
      font-family: var(--serif);
      font-size: clamp(2.4rem, 13vw, 4.2rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--verdict);
      overflow-wrap: anywhere;
    }

    .line {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.12rem;
      font-weight: 700;
      min-height: 1.5em;
    }

    .verdict-date {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    .result.is-rolling .picked {
      color: var(--muted);
      filter: blur(1px);
    }

    .result.is-rolling .gavel {
      animation: raise 0.35s ease-in-out infinite alternate;
    }

    .result.is-revealed .gavel {
      animation: strike 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
    }

    .result.is-revealed .picked {
      animation: stamp 0.32s cubic-bezier(0.2, 1.3, 0.4, 1);
    }

    .result.is-revealed {
      animation: thud 0.22s ease-out;
    }

    @keyframes raise {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(-28deg);
      }
    }

    @keyframes strike {
      from {
        transform: rotate(-35deg);
      }
      to {
        transform: rotate(0deg);
      }
    }

    @keyframes stamp {
      from {
        transform: scale(1.35);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes thud {
      0% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(3px);
      }
      100% {
        transform: translateY(0);
      }
    }

    .reactions {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .chip {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .chip:active {
      background: var(--gold-soft);
    }

    .reply {
      margin: 18px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--gold-soft);
      font-weight: 700;
    }

    .again {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
    }

    .again button {
      flex: 1;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-weight: 700;
    }

    .again button:disabled {
      opacity: 0.5;
    }

    .footer {
      margin-top: auto;
      padding-top: 40px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    .footer p {
      margin: 2px 0;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 600px) {
      .app {
        padding-top: calc(56px + env(safe-area-inset-top));
      }

      .fields {
        flex-direction: row;
        align-items: center;
      }

      .fields .input {
        flex: 1;
        min-width: 0;
      }

      .fields {
        gap: 10px;
      }

      .versus {
        margin: 0;
      }

      .result {
        padding: 30px 30px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .result.is-rolling .gavel,
      .result.is-revealed .gavel,
      .result.is-revealed .picked,
      .result.is-revealed {
        animation: none;
      }

      .primary {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <!-- Spoonbills 로고 (저장소에 받은 이미지를 벡터로 옮김). 색은 테마를 따른다. -->
      <svg class="logo" viewBox="0 0 363 320" aria-hidden="true">

      <span class="wordmark">Pick-assist</span>

    <div class="rule">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v17M7 20h10M5 7h14"></path>

      </svg>

    <!-- 슬로건 원문: "망설이지 마세요 - 판결은 Pick-assist 에게, 선택은 자유"
         줄바꿈 위치를 고정하려고 두 줄로 나누고, 이음표(-)는 화면에서만 숨긴다. -->
    <h1 class="slogan">
      <span class="slogan-main">망설이지 마세요</span><span class="visually-hidden"> - </span>
      <span class="slogan-sub">판결은 Pick-assist 에게, 선택은 자유</span>
    </h1>
    <p class="lede">두 선택지를 올리면, 공정하게 판결합니다.</p>

      if (!canAvoid) {
        return draw(count);
      }

      var index = draw(count - 1);
      return index >= avoidIndex ? index + 1 : index;
    }

    return {
      SELF_HARM_KEYWORDS: SELF_HARM_KEYWORDS,
      HEALTH_KEYWORDS: HEALTH_KEYWORDS,
      RESULT_LINES: RESULT_LINES,
      LIKE_LINES: LIKE_LINES,
      OTHER_LINE: OTHER_LINE,
      NOTICES: NOTICES,
      SAFETY_MESSAGES: SAFETY_MESSAGES,
      cryptoRandomInt: cryptoRandomInt,
      parseChoices: parseChoices,
      parsePair: parsePair,
      checkSafety: checkSafety,
      decide: decide,
      decidePair: decidePair,
      withParticle: withParticle,
      fillTemplate: fillTemplate,
      pickLineIndex: pickLineIndex
    };
  })();
  </script>

  <!-- 화면: DOM 연결과 연출만 담당한다. 결과는 PickCore.decide가 정한다. -->
  <script>
  (function () {
    "use strict";

    var ROLL_DURATION_MS = 700;
    var ROLL_STEP_MS = 90;
    var REDUCED_ROLL_DURATION_MS = 500;
    var CRYPTO_ERROR_MESSAGE = "이 브라우저에서는 공정한 추첨을 할 수 없어요. 최신 브라우저로 열어 주세요.";

    var form = document.getElementById("pick-form");
    var inputA = document.getElementById("choice-a");
    var inputB = document.getElementById("choice-b");
    var pickButton = document.getElementById("pick-button");
    var notice = document.getElementById("notice");
    var safety = document.getElementById("safety");
    var safetyMessage = document.getElementById("safety-message");
    var safetyCall = document.getElementById("safety-call");
    var result = document.getElementById("result");
    var pickedText = document.getElementById("picked");
    var verdictDate = document.getElementById("verdict-date");
    var lineText = document.getElementById("line");
    var reactions = document.getElementById("reactions");
    var reactLike = document.getElementById("react-like");
    var reactOther = document.getElementById("react-other");
    var reply = document.getElementById("reply");
    var again = document.getElementById("again");
    var againSame = document.getElementById("again-same");
    var againNew = document.getElementById("again-new");

    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    var coarsePointer = window.matchMedia("(pointer: coarse)");

    var state = {
      rolling: false,
      lastPair: ["", ""],
      lastDecision: null,
      lastLineIndex: -1,
      lastLikeIndex: -1
    };

    function clearOutputs() {
      notice.hidden = true;
      safety.hidden = true;
      safetyCall.hidden = true;
      safety.classList.remove("is-care");
      result.hidden = true;
      reply.hidden = true;
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.hidden = false;
    }

    function showSafety(decision) {
      safetyMessage.textContent = decision.message;

      var isSelfHarm = decision.kind === "selfHarm";
      safetyCall.hidden = !isSelfHarm;
      safety.classList.toggle("is-care", isSelfHarm);
      safety.hidden = false;
    }

    function setBusy(busy) {
      state.rolling = busy;
      pickButton.disabled = busy;
      againSame.disabled = busy;
      againNew.disabled = busy;
    }

    function run(first, second) {
      if (state.rolling) {
        return;
      }

      clearOutputs();

      var decision;
      try {
        decision = PickCore.decidePair(first, second);
      } catch (error) {
        showNotice(CRYPTO_ERROR_MESSAGE);
        return;
      }

      if (decision.status === "safety") {
        showSafety(decision);
        return;
      }

      if (decision.status === "invalid") {
        showNotice(decision.message);
        return;
      }

      if (decision.split) {
        // 한 칸에 "짜장 vs 짬뽕"을 붙여 넣은 경우 두 칸으로 나눠 보여준다.
        inputA.value = decision.choices[0];
        inputB.value = decision.choices[1];
      }

      state.lastPair = [decision.choices[0], decision.choices[1]];
      state.lastDecision = decision;

      if (coarsePointer.matches && document.activeElement) {
        // 모바일 키보드를 내려서 결과가 가려지지 않게 한다.
        document.activeElement.blur();
      }

      roll(decision);
    }

    // 짧은 연출. 결과는 이미 정해져 있고, 연출은 보여주기만 한다.
    function roll(decision) {
      setBusy(true);

      result.classList.remove("is-revealed");
      result.classList.add("is-rolling");
      reactions.hidden = true;
      again.hidden = true;
      lineText.textContent = "심리 중…";
      verdictDate.textContent = "";
      pickedText.textContent = decision.choices[0];
      result.hidden = false;
      result.scrollIntoView({ block: "nearest", behavior: "smooth" });

      if (reducedMotion.matches) {
        pickedText.textContent = "…";
        window.setTimeout(function () {
          reveal(decision);
        }, REDUCED_ROLL_DURATION_MS);
        return;
      }

      var step = 0;
      var flicker = window.setInterval(function () {
        step += 1;
        pickedText.textContent = decision.choices[step % 2];
      }, ROLL_STEP_MS);

      window.setTimeout(function () {
        window.clearInterval(flicker);
        reveal(decision);
      }, ROLL_DURATION_MS);
    }

    // 판결문 아래 "2026. 9. 29. 선고" (기기 시계 기준)
    function formatVerdictDate(date) {
      return date.getFullYear() + ". " + (date.getMonth() + 1) + ". " + date.getDate() + ". 선고";
    }

    function reveal(decision) {
      var lines = PickCore.RESULT_LINES;
      var lineIndex;

      try {
        lineIndex = PickCore.pickLineIndex(lines.length, null, state.lastLineIndex);
      } catch (error) {
        lineIndex = 0;
      }
      state.lastLineIndex = lineIndex;

      pickedText.textContent = decision.picked;
      lineText.textContent = PickCore.fillTemplate(lines[lineIndex], decision);
      verdictDate.textContent = formatVerdictDate(new Date());

      result.classList.remove("is-rolling");
      // 애니메이션을 다시 걸기 위해 레이아웃을 한 번 읽는다.
      void result.offsetWidth;
      result.classList.add("is-revealed");

      reactions.hidden = false;
      again.hidden = false;
      setBusy(false);
    }

    function showReply(text) {
      reactions.hidden = true;
      reply.textContent = text;
      reply.hidden = false;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      run(inputA.value, inputB.value);
    });

    // 첫 칸에서 Enter: 둘째 칸이 비어 있으면 둘째 칸으로 넘어간다.
    // 단, 첫 칸에 "짜장 vs 짬뽕"처럼 둘을 다 적었으면 바로 고른다.
    inputA.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" || event.isComposing) {
        return;
      }

      var secondIsEmpty = inputB.value.trim() === "";
      var firstHasBoth = PickCore.parseChoices(inputA.value).ok;

      if (secondIsEmpty && !firstHasBoth) {
        event.preventDefault();
        inputB.focus();
      }
    });

    [inputA, inputB].forEach(function (field) {
      field.addEventListener("input", function () {
        notice.hidden = true;
      });
    });

    reactLike.addEventListener("click", function () {
      var lines = PickCore.LIKE_LINES;
      var index;

      try {
        index = PickCore.pickLineIndex(lines.length, null, state.lastLikeIndex);
      } catch (error) {
        index = 0;
      }
      state.lastLikeIndex = index;

      showReply(lines[index]);
    });

    // "다른 거"는 재추첨하지 않는다. 이미 마음이 정해져 있었다는 걸 짚어 줄 뿐이다.
    reactOther.addEventListener("click", function () {
      if (!state.lastDecision) {
        return;
      }
      showReply(PickCore.fillTemplate(PickCore.OTHER_LINE, state.lastDecision));
    });

    againSame.addEventListener("click", function () {
      run(state.lastPair[0], state.lastPair[1]);
    });

    againNew.addEventListener("click", function () {
      clearOutputs();
      inputA.value = "";
      inputB.value = "";
      state.lastDecision = null;
      inputA.focus();
    });
  })();
  </script>
</body>
</html>
